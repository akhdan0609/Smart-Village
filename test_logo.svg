<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient for inner disc -->
    <radialGradient id="innerGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#4a0d18" />
      <stop offset="45%" stop-color="#2e0a12" />
      <stop offset="85%" stop-color="#0e1524" />
      <stop offset="100%" stop-color="#090d17" />
    </radialGradient>

    <!-- Path for Top Text: KKN DESA WARUNG MENTENG -->
    <!-- Arc from 205 deg to -25 deg (clockwise over top) at radius 202 -->
    <path id="topTextArc" d="M 67 250 A 183 183 0 1 1 433 250" fill="none" />
    
    <!-- Path for Bottom Text: WIGATA DHARMA -->
    <!-- Clockwise path from 155 deg to 25 deg along bottom so baseline follows outer rim -->
    <path id="bottomTextArc" d="M 425 250 A 175 175 0 0 1 75 250" fill="none" />
    <path id="bottomTextArcUpright" d="M 85 270 A 185 185 0 0 0 415 270" fill="none" />
  </defs>

  <!-- Base Circle / Outer Ring -->
  <circle cx="250" cy="250" r="240" fill="#0d1424" stroke="#ffffff" stroke-width="4" />
  
  <!-- Outer Ring Accent lines -->
  <circle cx="250" cy="250" r="233" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  <circle cx="250" cy="250" r="168" fill="none" stroke="#ffffff" stroke-width="3.5" />

  <!-- Inner Badge Circle with Radial Gradient -->
  <circle cx="250" cy="250" r="166" fill="url(#innerGlow)" />

  <!-- Top Text: KKN DESA WARUNG MENTENG -->
  <text fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="4">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      KKN DESA WARUNG MENTENG
    </textPath>
  </text>

  <!-- Left Star -->
  <g transform="translate(82, 290) rotate(-45)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#ffffff" />
  </g>

  <!-- Right Star -->
  <g transform="translate(418, 290) rotate(45)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#ffffff" />
  </g>

  <!-- Bottom Text: WIGATA DHARMA -->
  <text fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="6">
    <textPath href="#bottomTextArcUpright" startOffset="50%" text-anchor="middle">
      WIGATA DHARMA
    </textPath>
  </text>
</svg>